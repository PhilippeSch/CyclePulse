name: CI

# Branches are checked through their pull request; a push builds main only.
# Running both for every push doubled the load and the noise.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # The runner image ships several Xcodes under version-suffixed names,
      # so pick the newest rather than pinning a path that moves.
      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -switch "$latest"

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # The runner holds no certificates, so the watchOS device build has to
      # be told not to sign. The simulator tests below deliberately keep their
      # default ad-hoc signing: an unsigned .xctrunner fails to launch.
      - name: Build the watch app
        run: |
          xcodebuild build \
            -scheme "Cycle Pulse Watch App" \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO

      # One simulator, tests in sequence: parallel clones on a shared runner
      # are what made UI tests time out at random. TEST_RUNNER_CI reaches the
      # test process as CI, so the launch-timing test skips itself.
      - name: Test the iPhone app
        env:
          TEST_RUNNER_CI: "1"
        run: |
          xcodebuild test \
            -scheme "Cycle Pulse" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
